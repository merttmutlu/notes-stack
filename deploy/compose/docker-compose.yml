services:
  postgres:
    image: postgres:18.3
    container_name: notes-stack-postgres
    restart: unless-stopped
    env_file:
      - ../../env/postgres.env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    container_name: notes-stack-api
    restart: unless-stopped
    environment:
      PORT: "${PORT}"
      DATABASE_URL: "${DATABASE_URL}"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT}:${PORT}"

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: notes-stack-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:80"
