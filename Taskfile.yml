version: "3"

tasks:
  compose:up:
    desc: Start the full local stack with Docker Compose
    cmds:
      - docker compose -f deploy/compose/docker-compose.yml --env-file env/postgres.env --env-file env/api.env up -d --build

  compose:down:
    desc: Stop the full local stack with Docker Compose
    cmds:
      - docker compose -f deploy/compose/docker-compose.yml --env-file env/postgres.env --env-file env/api.env down

  compose:logs:
    desc: Show logs for the full local stack
    cmds:
      - docker compose -f deploy/compose/docker-compose.yml --env-file env/postgres.env --env-file env/api.env logs -f

  postgres:up:
    desc: Start the local Postgres service with Docker Compose
    cmds:
      - docker compose -f deploy/compose/docker-compose.yml --env-file env/postgres.env up -d postgres

  postgres:migrate:
    desc: Apply SQL migrations to the local Postgres service
    cmds:
      - docker compose -f deploy/compose/docker-compose.yml --env-file env/postgres.env exec -T postgres psql -U notes -d notes_stack < db/migrations/001_create_notes.sql
      - docker compose -f deploy/compose/docker-compose.yml --env-file env/postgres.env exec -T postgres psql -U notes -d notes_stack < db/migrations/002_enable_pgcrypto.sql

  postgres:down:
    desc: Stop the local Postgres service
    cmds:
      - docker compose -f deploy/compose/docker-compose.yml --env-file env/postgres.env down

  postgres:logs:
    desc: Show Postgres container logs
    cmds:
      - docker compose -f deploy/compose/docker-compose.yml --env-file env/postgres.env logs -f postgres

  api:run:
    desc: Run the local API against the local Postgres service
    dir: apps/api
    dotenv:
      - ../../env/api.env
    cmds:
      - go run ./cmd/api

  web:install:
    desc: Install frontend dependencies
    dir: apps/web
    cmds:
      - npm install

  web:run:
    desc: Run the frontend locally
    dir: apps/web
    cmds:
      - npm run dev -- --host 0.0.0.0
